<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyoo MFS</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css"  />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <main class="flex justify-center items-center h-screen">
     <div class="mockup-phone ">
  <div class="camera"></div>
  <div class="display">
    <div class="artboard artboard-demo phone-3">
      
      <!-- available balance -->
      <div>
        <div class="stats shadow">
  <div class="stat">
    <div id="Balance-money" class="stat-value">89400</div>
    <div class="stat-desc">Available Balance</div>
  </div>
</div>

      </div>
      <div class="divider"></div>
      <!-- user action buttons-->

      <div>

        <button id="btn-add-money" class="btn btn-lg hover:bg-white hover:text-black">
          Add money
        </button>

      <button id="btn-cashout" class="hover:bg-white hover:text-black btn btn-lg">
        Cash Out
      </button>

      </div>

      <div class="divider"></div>
      <!--add money from start-->

      <div id="cash in-btn-card" class="hidden card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
      <form class="card-body">
        <div class="form-control">
          <label class="label">
            <span class="label-text">Amount</span>
          </label>
          <input id="Add-money" type="number" placeholder="Cash-in Amount" class="input input-bordered" required />
        </div>
        <div class="form-control">
          <label class="label">
            <span class="label-text">PIN</span>
          </label>
          <input id="pin-number" type="password" placeholder="password" class="input input-bordered" autocomplete="off" required />
          <label class="label">
            <a href="#" class="label-text-alt link link-hover">Forgot password?</a>
          </label>
        </div>
        <div class="form-control mt-6">
          <button id="btn-primary" class="btn btn-primary">Add Money</button>
        </div>
      </form>
    </div>

      <!--add money from end-->

      <!--cashout from start-->

      <div id="cash out-btn-card" class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
      <form class="card-body">
        <div class="form-control">
          <label class="label">
            <span class="label-text">Amount</span>
          </label>
          <input id="cashout-money" type="number" placeholder="Cash-out Amount" class="input input-bordered" required />
        </div>
        <div class="form-control">
          <label class="label">
            <span class="label-text">PIN</span>
          </label>
          <input id="pin-cashout-number" type="password" placeholder="password" class="input input-bordered" autocomplete="off" required />
          <label class="label">
            <a href="#" class="label-text-alt link link-hover">Forgot password?</a>
          </label>
        </div>
        <div class="form-control mt-6">
          <button id="btn-cashout-primary" class="btn btn-primary">Cash Out</button>
        </div>
      </form>
    </div>

      <!--cashout from end-->
      

    </div>
  </div>
</div>
  </main>

  <script src="js/home.js"></script>
  <script src="js/cashout.js"></script>
  <script src="js/feature.js"></script>
   
</body>
</html>
